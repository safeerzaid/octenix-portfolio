<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle ring (faint white) -->
  <circle cx="50" cy="50" r="44"
    fill="none"
    stroke="rgba(255,255,255,0.2)"
    stroke-width="1.5"
  />

  <!-- Inner circle arc (partial, faint white) -->
  <circle cx="50" cy="50" r="30"
    fill="none"
    stroke="rgba(255,255,255,0.12)"
    stroke-width="1"
  />

  <!-- Chevron / arrow shape (orange gradient) -->
  <!-- Top arm going top-right -->
  <line x1="62" y1="20" x2="38" y2="50"
    stroke="url(#orangeGrad)"
    stroke-width="11"
    stroke-linecap="round"
  />
  <!-- Bottom arm going bottom-right -->
  <line x1="38" y1="50" x2="62" y2="80"
    stroke="url(#orangeGrad)"
    stroke-width="11"
    stroke-linecap="round"
  />
</svg>
